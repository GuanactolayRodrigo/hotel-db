services:

  mysql:
    image: mysql:8.4
    container_name: hotel-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - hotel-network

    restart: unless-stopped

volumes:
  mysql-data:

networks:
  hotel-network:
    driver: bridge